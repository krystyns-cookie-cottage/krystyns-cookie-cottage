<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Krystyn's Cookie Cottage</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&family=Nunito:wght@400;800&family=Young+Serif&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #FBF1E8; --forest: #33422F; --forest-soft: #5A6855; --blush-deep: #D98F8A; --white: #FFFDF9; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
      background: var(--paper); color: var(--forest); font: 400 1.05rem/1.6 "Nunito", system-ui, sans-serif; text-align: center;
    }
    main { max-width: 440px; }
    img { width: 160px; height: 160px; border-radius: 50%; }
    .script { font: 400 2.2rem/1 "Allura", cursive; color: var(--blush-deep); margin: 18px 0 4px; }
    h1 { font: 400 clamp(1.8rem, 6vw, 2.4rem)/1.15 "Young Serif", Georgia, serif; margin: 0; text-wrap: balance; }
    p { color: var(--forest-soft); margin: 14px 0 26px; }
    a {
      display: inline-block; padding: 14px 26px; border-radius: 999px; background: var(--forest); color: var(--white);
      font-weight: 800; text-decoration: none;
    }
    a:hover { background: #607356; }
    a:focus-visible { outline: 3px solid var(--blush-deep); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/images/logo.jpg?v=2" alt="Krystyn's Cookie Cottage logo">
    <p class="script">Oh, crumbs!</p>
    <h1>This page wandered off.</h1>
    <p>The page you're looking for isn't here, but the cookies are.</p>
    <a href="/">Back to the Cottage</a>
  </main>
</body>
</html>
